[project]
name = "online-cinema-api"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.119.0,<0.120.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-env (>=1.2.0,<2.0.0)",
    "alembic (>=1.17.0,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.3.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pytest-order (>=1.3.0,<2.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "validators (>=0.35.0,<0.36.0)",
    "botocore (>=1.40.15)",
    "pillow (>=11.3.0,<12.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "aiosmtplib (>=4.0.2,<5.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "aioboto3 (>=15.2.0,<16.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "psycopg2[binary] (>=2.9.11,<3.0.0)"
]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false
skip-magic-trailing-comma = false
preview = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["src/tests"]
env = ["ENVIRONMENT=testing"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
